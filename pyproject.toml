[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyadas"
version = "0.1.0"
description = "Open-Source Driver Monitoring System"
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    "opencv-python",
    "mediapipe==0.10.14",
    "PySide6",
    "numpy",
    "scipy"
]